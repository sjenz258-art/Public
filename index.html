<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#327559"><meta name="description" content="為小朋友設計的百數表遊戲：找數字與數字捉迷藏。"><title>百數小花園 · 數字遊戲</title><link rel="stylesheet" href="style.css"></head>
<body><header><a class="brand" href="./"><span class="brand-icon">✿</span> 百數小花園</a><button id="sound" class="icon" aria-label="開啟音效" aria-pressed="false">♫ <span>音效關</span></button></header>
<main><section class="intro"><div class="eyebrow">LITTLE NUMBERS, BIG DISCOVERIES</div><h1>和數字，<span>玩在一起。</span><svg viewBox="0 0 80 80" aria-hidden="true"><path d="M40 15C20-7 3 16 20 30C-7 32 3 59 25 52C15 77 43 86 48 61C65 82 87 60 66 46C92 39 77 11 59 26C59 2 35 0 40 15" fill="#eebc54"/><circle cx="43" cy="40" r="10" fill="#fff7dc"/></svg></h1><p>找一找、想一想，每一次發現都很棒。</p></section>
<div class="layout"><aside id="settings"><div class="section-label">01 / 選個遊戲</div><div class="game-picker"><button class="game selected" data-game="find"><span class="game-illustration">⌕</span><span><strong>找數字</strong><small>眼睛亮亮，找出指定數字</small></span><span class="radio"></span></button><button class="game" data-game="missing"><span class="game-illustration lavender">▦</span><span><strong>數字捉迷藏</strong><small>誰躲起來了？填上空格吧</small></span><span class="radio"></span></button></div>
<div id="modeLabel" class="section-label">02 / 挑戰方式</div><div id="modePicker" class="segments"><button data-mode="timed" class="selected">◷ 限時挑戰</button><button data-mode="race">⚑ 極速挑戰</button></div><p id="modeHelp" class="help">時間內，找到越多數字越好！</p>
<div id="rangeSetting" class="setting-row"><label for="range">數字範圍</label><select id="range"><option value="20">1–20 · 小小探索</option><option value="50">1–50 · 再走遠一點</option><option value="100" selected>1–100 · 整座花園</option></select></div><div id="levelSetting" hidden><div class="section-label">02 / 選擇關卡</div><div id="levels" class="levels" aria-label="選擇關卡"></div><p id="levelHelp" class="help"></p></div><div id="timeSetting" class="setting-row"><label for="duration">挑戰時間</label><select id="duration"><option value="30">30 秒</option><option value="60">60 秒</option><option value="90">90 秒</option><option value="custom">自訂時間</option></select></div><label id="customWrap" hidden>秒數 <input id="customTime" type="number" min="5" max="600" value="45" inputmode="numeric"></label><p id="raceHelp" class="help" hidden>完成 10 個不重複的數字，看看用了多久。</p>
<button id="start" class="primary">開始玩 <span>↗</span></button><p class="gentle">✧ 不用怕答錯，再試一次就好。</p><div class="best"><span>♧ 我的最佳紀錄</span><strong id="best">等你來挑戰</strong></div></aside>
<section class="play-card" aria-label="百數表遊戲"><div class="board-top"><span class="pill" id="boardLabel">找數字</span><span class="board-caption">每天一點點，發現多一點。</span><button id="pause" hidden class="icon">Ⅱ 暫停</button></div><div class="challenge"><div><span id="prompt">準備好你的小眼睛</span><strong id="target">一起找數字！</strong></div><div id="stats" hidden><span id="timer">30.0</span><small id="score">已找到 0 個</small></div><span id="idleArt" aria-hidden="true">☀</span></div><div class="board-wrap"><div id="board" class="board"></div><div id="overlay" class="overlay" hidden></div></div><div id="choices" class="choices" hidden></div><div class="board-bottom"><span id="feedback" role="status" aria-live="polite">輕點「開始玩」，一起出發吧。</span><span id="rangeLabel">1 — 100</span></div></section></div>
<footer><span>一格一格，慢慢長大。<span class="tiny-flower">✿</span></span><span>為小小探索家設計</span></footer></main>
<dialog id="results"><div class="result-flower">✿</div><p class="eyebrow">YOU DID IT!</p><h2>今天也有新發現！</h2><p id="resultSummary"></p><div id="resultMetrics"></div><p id="recordNote"></p><button id="nextLevel" class="primary" hidden>下一關 ↗</button><button id="again" class="primary">再玩一次 ↗</button><button id="closeResult" class="secondary">回到花園</button></dialog><script src="app.js"></script></body></html>
